openapi: 3.0.3
info:
  title: PageFire Home Events API
  version: 1.0.0
  description: Home Event ingestion, dashboard, and notification plugin configuration.
servers:
  - url: /api/v1
security:
  - cookieAuth: []
tags:
  - name: Auth
  - name: Users
  - name: Home Events
  - name: Settings
paths:
  /healthz:
    get:
      summary: Check server and database health
      security: []
      servers:
        - url: /
      responses:
        '200':
          description: Healthy
        '503':
          description: Database unavailable
  /auth/setup:
    get:
      tags: [Auth]
      summary: Check whether the first admin must be created
      security: []
      responses:
        '200':
          description: Setup status
    post:
      tags: [Auth]
      summary: Create the first admin
      security: []
      responses:
        '201':
          description: Admin created
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      security: []
      responses:
        '200':
          description: Session created
        '401':
          description: Invalid credentials
  /auth/logout:
    post:
      tags: [Auth]
      summary: End the current session
      responses:
        '200':
          description: Session ended
  /auth/me:
    get:
      tags: [Auth]
      summary: Get the signed-in user
      responses:
        '200':
          description: User
        '401':
          description: Not signed in
  /auth/password:
    put:
      tags: [Auth]
      summary: Change the signed-in user's password
      responses:
        '200':
          description: Password changed
  /auth/invite/{token}:
    parameters:
      - in: path
        name: token
        required: true
        schema: {type: string}
    get:
      tags: [Auth]
      summary: Inspect an invite
      security: []
      responses:
        '200':
          description: Invite details
    post:
      tags: [Auth]
      summary: Accept an invite and set a password
      security: []
      responses:
        '200':
          description: Account activated
  /users:
    get:
      tags: [Users]
      summary: List users
      responses:
        '200':
          description: Users
    post:
      tags: [Users]
      summary: Create a user and invite link
      description: Admin only.
      responses:
        '201':
          description: User created
  /users/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
    get:
      tags: [Users]
      summary: Get a user
      responses:
        '200':
          description: User
    put:
      tags: [Users]
      summary: Update a user
      description: Admin only.
      responses:
        '200':
          description: User updated
    delete:
      tags: [Users]
      summary: Delete a user
      description: Admin only.
      responses:
        '204':
          description: User deleted
  /events:
    post:
      tags: [Home Events]
      summary: Ingest a start, stop, or info event
      description: A browser session or the single event ingestion key may submit events.
      security:
        - cookieAuth: []
        - ingestionKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
      responses:
        '201':
          description: New event applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResult'
        '200':
          description: Already seen, duplicate active start, or no active stop target
        '400':
          description: Invalid event
        '401':
          description: Invalid credentials
    get:
      tags: [Home Events]
      summary: List recent events for the signed-in user
      responses:
        '200':
          description: Events
  /events/{eventID}:
    parameters:
      - in: path
        name: eventID
        required: true
        description: Client-supplied event_id
        schema: {type: string}
    get:
      tags: [Home Events]
      summary: Get event details and plugin deliveries
      responses:
        '200':
          description: Event detail
        '404':
          description: Event not found
  /alert-events:
    get:
      tags: [Home Events]
      summary: Get filtered Home Events dashboard feed
      parameters:
        - in: query
          name: window
          schema: {type: string, enum: [1h, 1d, 1w, 1m], default: 1d}
        - in: query
          name: type
          schema: {type: string}
        - in: query
          name: class
          schema: {type: string, enum: [info, warning, error]}
        - in: query
          name: source
          schema: {type: string}
        - in: query
          name: client
          description: Incident key
          schema: {type: string}
        - in: query
          name: open
          schema: {type: boolean}
        - in: query
          name: message_regex
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer}
        - in: query
          name: offset
          schema: {type: integer}
      responses:
        '200':
          description: Events, chart buckets, type counts, facets, and totals
  /home-alerts/active:
    get:
      tags: [Home Events]
      summary: List active Home Alerts for stop selection
      responses:
        '200':
          description: Active alerts
  /home-alerts/{alertID}:
    parameters:
      - in: path
        name: alertID
        required: true
        schema: {type: string}
    get:
      tags: [Home Events]
      summary: Get an active Home Alert
      responses:
        '200':
          description: Active alert
        '404':
          description: No active alert with this ID
  /home-stats:
    get:
      tags: [Home Events]
      summary: Get event and delivery counts for a Unix-second range
      parameters:
        - in: query
          name: from
          schema: {type: integer, format: int64}
        - in: query
          name: to
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Counts
  /event-ingestion-key:
    get:
      tags: [Settings]
      summary: Get key status without revealing the secret
      responses:
        '200':
          description: Key status
    post:
      tags: [Settings]
      summary: Create or rotate the single ingestion key
      description: Admin only. The raw key is returned once.
      responses:
        '201':
          description: New key
    delete:
      tags: [Settings]
      summary: Revoke the ingestion key
      description: Admin only.
      responses:
        '204':
          description: Key revoked
  /home-plugins:
    get:
      tags: [Settings]
      summary: List Telegram and Pushover plugin settings
      responses:
        '200':
          description: Plugin settings with secrets redacted
  /home-plugins/{kind}:
    parameters:
      - in: path
        name: kind
        required: true
        schema: {type: string, enum: [telegram, pushover]}
    put:
      tags: [Settings]
      summary: Save a notification plugin
      description: Admin only.
      responses:
        '200':
          description: Plugin saved
    delete:
      tags: [Settings]
      summary: Remove a notification plugin
      description: Admin only.
      responses:
        '204':
          description: Plugin removed
  /home-plugins/{kind}/test:
    parameters:
      - in: path
        name: kind
        required: true
        schema: {type: string, enum: [telegram, pushover]}
    post:
      tags: [Settings]
      summary: Send a plugin test message
      description: Admin only.
      responses:
        '200':
          description: Test message sent
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: pagefire_session
    ingestionKey:
      type: http
      scheme: bearer
      description: The single pfe_ ingestion key from Event Ingestion.
  schemas:
    EventRequest:
      type: object
      required: [event_id, incident_key, event]
      properties:
        event_id:
          type: string
          maxLength: 128
          description: Unique per source; retrying the same ID is idempotent.
        incident_key:
          type: string
          maxLength: 256
          description: Required for every event. Start and stop use the same value.
        event:
          type: string
          enum: [start, stop, info]
        severity:
          type: string
          enum: [low, mid, high]
          description: Required for start; info defaults to low.
        summary:
          type: string
          maxLength: 500
          description: Required for start and info.
        details:
          type: string
          maxLength: 10000
        repeat_interval_seconds:
          type: integer
          minimum: 300
          description: Applies only to high starts.
    EventResult:
      type: object
      properties:
        event_id: {type: string}
        alert_id: {type: string}
        status:
          type: string
          enum: [applied, already_seen, duplicate_active, not_active]
        deliveries: {type: integer}

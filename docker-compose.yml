services:
  pagefire:
    build: .
    # Or use a pre-built image:
    # image: ghcr.io/pagefire/pagefire:latest
    ports:
      - "3001:3000"
    volumes:
      - pagefire-data:/data
    environment:
      # --- Core ---
      PAGEFIRE_PORT: "3000"
      PAGEFIRE_DATA_DIR: "/data"
      PAGEFIRE_LOG_LEVEL: "info"
      # PAGEFIRE_DATABASE_URL: "/data/pagefire.db"

      # --- Engine ---
      # PAGEFIRE_ENGINE_INTERVAL_SECONDS: "5"       # Home Events worker interval
    restart: unless-stopped

volumes:
  pagefire-data:
